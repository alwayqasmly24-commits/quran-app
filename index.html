<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قرآني - صدقة جارية</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#E8DCC3;font-family:'Amiri',serif;color:#1a1a1a;padding:15px}
h1{text-align:center;color:#1B5E2A;font-size:26px;margin:15px 0 20px}
select{width:100%;padding:14px;font-size:20px;font-family:inherit;border-radius:12px;border:1px solid #ccc;background:#eee;text-align:right}
.frame{margin-top:15px;background:#C5A227;padding:10px;border-radius:10px}
.inner{background:#FFFBEF;border:3px solid #1E3A8A;border-radius:8px;padding:25px 15px;min-height:200px;text-align:center}
.basmala{font-size:28px;color:#1B5E2A;margin-bottom:20px;font-weight:bold}
.ayah{font-size:28px;line-height:2.4;display:inline}
.num{color:#C5A227;font-size:18px;margin:0 4px}
.loading{font-size:32px;padding:40px 0}
audio{width:100%;margin-top:15px}
.error{color:red;font-size:18px}
</style>
</head>
<body>
<h1>🕌 قرآني - صدقة جارية</h1>
<select id="surahSelect" onchange="loadSurah()"></select>
<div class="frame"><div class="inner" id="content"><div class="loading">جاري التحميل...</div></div></div>
<audio id="player" controls></audio>

<script>
const surahs = ["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];
const sel = document.getElementById('surahSelect');
surahs.forEach((n,i)=>{let o=document.createElement('option');o.value=i+1;o.text=(i+1)+' - سورة '+n;sel.appendChild(o);});

async function loadSurah(){
  const num = sel.value;
  const content = document.getElementById('content');
  const player = document.getElementById('player');
  content.innerHTML = '<div class="loading">جاري التحميل...</div>';
  player.src = `https://cdn.islamic.network/quran/audio/128/ar.alafasy/${num}.mp3`;
  let data = null;
  // المحاولة 1
  try{
    let r = await fetch(`https://api.alquran.cloud/v1/surah/${num}/quran-uthmani`);
    let j = await r.json();
    if(j.data) data = j.data.ayahs;
  }catch(e){}
  // المحاولة 2 اذا الاولى فشلت
  if(!data){
    try{
      let r2 = await fetch(`https://api.alquran.cloud/v1/surah/${num}`);
      let j2 = await r2.json();
      if(j2.data) data = j2.data.ayahs;
    }catch(e){}
  }
  if(!data){
    content.innerHTML = '<div class="error">تعذر التحميل، تأكد من الإنترنت وحدث الصفحة</div>';
    return;
  }
  let html = '';
  // البسملة مرة واحدة فقط في الأعلى، ما عدا الفاتحة والتوبة
  if(num != 1 && num != 9){
    html += '<div class="basmala">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>';
  }
  data.forEach(a=>{
    let text = a.text;
    // اذا البسملة موجودة داخل أول آية في غير الفاتحة، احذفها لأننا حطيناها فوق
    if(a.numberInSurah==1 && num != 1 && num != 9){
      text = text.replace('بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ','').trim();
    }
    html += `<span class="ayah">${text} <span class="num">﴿${a.numberInSurah}﴾</span> </span>`;
  });
  content.innerHTML = html;
}
loadSurah();
</script>
</body>
</html>
