<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قرآني - صدقة جارية</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Amiri',serif;background:#e8dfc8;margin:0;padding:10px}
h1{text-align:center;color:#0a5c36;font-size:21px;margin:8px}
select{width:100%;padding:12px;margin:10px 0;font-size:18px;border-radius:10px;font-family:'Amiri',serif}
.mushaf{background:#fffdf0;border:4px solid #b8860b;outline:2px solid #1a3a8a;outline-offset:-10px;border-radius:6px;padding:22px 14px;font-family:'Amiri Quran','Amiri',serif;font-size:32px;line-height:2.15;text-align:justify;direction:rtl}
.surah-header{background:linear-gradient(90deg,#1a3a8a,#2a4a9a,#1a3a8a);border:3px solid #d4a017;border-radius:12px;padding:10px;margin:0 0 18px;text-align:center;position:relative}
.surah-header-inner{background:#fffdf0;border:2px solid #b8860b;border-radius:20px;display:inline-block;padding:4px 28px}
.surah-header span{font-size:30px;font-weight:bold;color:#111}
.basmala{text-align:center;font-size:34px;margin:0 0 16px;color:#111;line-height:1.8}
.basmala b{color:#c0392b}
.ayah-num{display:inline-block;background:#fdf6d8;border:2px solid #b8860b;color:#111;font-size:20px;font-weight:bold;width:34px;height:34px;line-height:30px;text-align:center;border-radius:50%;margin:0 4px;vertical-align:middle;box-shadow:0 0 0 2px #fffdf0,0 0 0 3px #b8860b}
audio{width:100%;margin-top:12px}
.loading{text-align:center;padding:20px}
</style>
</head>
<body>
<h1>🕌 قرآني - صدقة جارية</h1>
<select id="surah" onchange="loadSurah()"></select>
<div id="box" class="mushaf"><div class="loading">جاري التحميل...</div></div>
<audio id="audio" controls></audio>
<script>
const toArabicNum=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
async function init(){
 let r=await fetch("https://api.alquran.cloud/v1/surah");
 let j=await r.json();
 document.getElementById("surah").innerHTML=j.data.map(s=>`<option value="${s.number}">${s.number} - ${s.name}</option>`).join("");
 loadSurah();
}
async function loadSurah(){
 let n=document.getElementById("surah").value||2;
 document.getElementById("surah").value=n;
 let box=document.getElementById("box");
 box.innerHTML='<div class="loading">جاري التحميل...</div>';
 let r=await fetch(`https://api.alquran.cloud/v1/surah/${n}/quran-uthmani`);
 let j=await r.json();
 let s=j.data;
 let ayahs=s.ayahs;
 let cleanName=s.name.replace(/سُورَةُ|سورة/g,"").trim();
 let html=`<div class="surah-header"><div class="surah-header-inner"><span>سورة ${cleanName}</span></div></div>`;
   ayahs=ayahs.slice(1).map((a,i)=>({...a,numberInSurah:i+1}));
 } else if(n!=9){
   let first=ayahs[0].text;
   first=first.replace(/^بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ */,"");
   ayahs[0]={...ayahs[0],text:first};
 }
 ayahs.forEach(a=>{
   html+=`${a.text} <span class="ayah-num">${toArabicNum(a.numberInSurah)}</span> `;
 });
 box.innerHTML=html;
 document.getElementById("audio").src=`https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/${n}.mp3`;
}
init();
</script>
</body>
</html>
