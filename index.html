<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قرآني - صدقة جارية</title>
<style>
body{font-family:Arial;background:#f5f0e6;margin:0;padding:12px}
h1{text-align:center;color:#0a5c36;font-size:22px}
select{width:100%;padding:12px;margin:10px 0;font-size:16px;border-radius:10px}
.mushaf{background:#fffdf7;border:2px solid #d4a017;border-radius:14px;padding:18px 14px;font-size:26px;line-height:2.15;text-align:justify;direction:rtl}
.basmala{text-align:center;font-size:28px;margin:0 0 14px;color:#0a5c36;font-weight:bold}
.ayah-num{color:#b8860b;font-size:20px;padding:0 4px;white-space:nowrap}
.surah-name{text-align:center;font-size:24px;font-weight:bold;color:#0a5c36;margin:6px 0 10px}
audio{width:100%;margin-top:12px}
.loading{text-align:center;padding:20px}
</style>
</head>
<body>
<h1>🕌 قرآني - صدقة جارية</h1>
<select id="surah" onchange="loadSurah()"></select>
<div id="box" class="mushaf"><div class="loading">جاري التحميل...</div></div>
<audio id="audio" controls></audio>
<script>
const toArabicNum=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
async function init(){
 let r=await fetch("https://api.alquran.cloud/v1/surah");
 let j=await r.json();
 document.getElementById("surah").innerHTML=j.data.map(s=>`<option value="${s.number}">${s.number} - ${s.name}</option>`).join("");
 loadSurah();
}
async function loadSurah(){
 let n=document.getElementById("surah").value||2;
 document.getElementById("surah").value=n;
 let box=document.getElementById("box");
 box.innerHTML='<div class="loading">جاري التحميل...</div>';
 let r=await fetch(`https://api.alquran.cloud/v1/surah/${n}`);
 let j=await r.json();
 let s=j.data;
 let ayahs=s.ayahs;
 let html=`<div class="surah-name">سورة ${s.name}</div>`;
 if(n!=1 && n!=9){
   html+=`<div class="basmala">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>`;
   let first=ayahs[0].text;
   first=first.replace(/^بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ */,"");
   ayahs[0]={...ayahs[0],text:first};
 }
 ayahs.forEach(a=>{
   html+=`${a.text} <span class="ayah-num">﴿${toArabicNum(a.numberInSurah)}﴾</span> `;
 });
 box.innerHTML=html;
 document.getElementById("audio").src=`https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/${n}.mp3`;
}
init();
</script>
</body>
</html>
